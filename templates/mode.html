{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:700px;">
  <p>現在モード: <strong>{{ current_mode }}</strong></p>
  <form method="POST" action="/admin/mode{{ active_qs }}" style="display:flex;gap:10px;flex-wrap:wrap;">
    <input type="hidden" name="active_institution_id" value="{{ current_institution_id }}">
    <button name="mode" value="NORMAL">通常</button>
    <button name="mode" value="DISASTER">災害</button>
  </form>
</div>
{% endblock %}
